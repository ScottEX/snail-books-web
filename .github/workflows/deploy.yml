name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:web

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:web
      - name: 部署前端 dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: dist/
          target: /opt/snail-books-web-staging/
          strip_components: 0
      - name: Encode app.py
        run: |
          echo "APP_B64=$(base64 -w0 app.py)" >> $GITHUB_ENV
      - name: 部署后端 app.py
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_B64
          script: |
            echo "$APP_B64" | base64 -d > /opt/snail-books-web-staging/app.py
            echo "✅ app.py deployed ($(wc -c < /opt/snail-books-web-staging/app.py) bytes)"
      - name: 重启测试服务
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: systemctl restart snail-books-staging

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:web
      - name: 部署前端 dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: dist/
          target: /opt/snail-books-web/
          strip_components: 0
      - name: Encode app.py
        run: |
          echo "APP_B64=$(base64 -w0 app.py)" >> $GITHUB_ENV
      - name: 部署后端 app.py
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_B64
          script: |
            echo "$APP_B64" | base64 -d > /opt/snail-books-web/app.py
            echo "✅ app.py deployed ($(wc -c < /opt/snail-books-web/app.py) bytes)"
      - name: 重启生产服务
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: systemctl restart snail-books
