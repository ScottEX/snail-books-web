<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PDF</title>
  <link rel="stylesheet" href="pdf_viewer.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1c1c1e; }
    #container {
      position: absolute; inset: 0; overflow: auto;
    }
    #viewer .page {
      margin: 10px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="container"><div id="viewer" class="pdfViewer"></div></div>

  <script type="module">
    import * as pdfjsLib from '../build/pdf.min.mjs';
    import { PDFViewer, PDFLinkService, EventBus } from './pdf_viewer.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = '../build/pdf.worker.min.mjs';

    const url = new URLSearchParams(location.search).get('file') || '';
    if (!url) return;

    const container = document.getElementById('container');
    const viewerEl = document.getElementById('viewer');

    const eventBus = new EventBus();
    const linkService = new PDFLinkService({ eventBus });
    const pdfViewer = new PDFViewer({
      container, viewer: viewerEl, eventBus, linkService,
      textLayerMode: 0, annotationMode: 2, maxCanvasPixels: 16777216,
    });
    linkService.setViewer(pdfViewer);
    pdfViewer.currentScaleValue = 'page-width';

    // Events → parent
    eventBus.on('pagesloaded', () => {
      parent.postMessage({ type: 'pdf-ready', data: { numPages: pdfViewer.pagesCount } }, '*');
    }, { once: true });
    eventBus.on('pagechanging', evt => {
      parent.postMessage({ type: 'pdf-page-change', data: { page: evt.pageNumber } }, '*');
    });
    eventBus.on('scalechanging', evt => {
      parent.postMessage({ type: 'pdf-zoom-change', data: { scale: evt.scale } }, '*');
    });

    // Load PDF
    const lang = new URLSearchParams(location.search).get('lang') || 'zh';
    const isBlob = url.startsWith('blob:');
    pdfjsLib.getDocument({
      url,
      withCredentials: !isBlob,
      httpHeaders: isBlob ? undefined : { 'X-Lang': lang },
      enableXfa: true,
      cMapUrl: '../cmaps/', cMapPacked: true,
      standardFontDataUrl: '../standard_fonts/',
    }).promise.then(doc => {
      pdfViewer.setDocument(doc);
      linkService.setDocument(doc, null);
      pdfViewer.currentScaleValue = 'page-width';
    }).catch(err => {
      parent.postMessage({ type: 'pdf-error', data: { message: err.message } }, '*');
    });

    // Parent commands
    window.addEventListener('message', e => {
      const { type, data } = e.data || {};
      switch (type) {
        case 'zoom-in':  pdfViewer.currentScale *= 1.25; break;
        case 'zoom-out': pdfViewer.currentScale /= 1.25; break;
        case 'zoom-reset': pdfViewer.currentScaleValue = 'page-width'; break;
        case 'set-scale': if (data?.scale) pdfViewer.currentScale = data.scale; break;
        case 'jump-page': if (data?.page) pdfViewer.currentPageNumber = data.page; break;
      }
    });
  </script>
</body>
</html>
