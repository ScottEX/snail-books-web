<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{background:#F9F7F4;padding:40px;font-family:system-ui}
h2{font-size:14px;color:#999;margin:24px 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{width:40px;height:40px;border-radius:50%;background:rgba(217,213,207,0.30);backdrop-filter:blur(12px);border:0.5px solid rgba(0,0,0,0.10);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.btn svg{width:16px;height:16px;stroke:#2C2626;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:11px;color:#8C8583;margin-top:4px;text-align:center}
</style></head><body>

<h2>当前 (magnifying glass)</h2>
<div class="row">
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="10" y1="7" x2="10" y2="13"/></svg></div><div class="label">放大</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><polyline points="8 21 3 21 3 16"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></div><div class="label">重置</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="7" y1="10" x2="13" y2="10"/></svg></div><div class="label">缩小</div></div>
</div>

<h2>A — 简洁加/减/1x</h2>
<div class="row">
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="label">+</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2626" font-family="system-ui">1x</text></svg></div><div class="label">1×</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="label">−</div></div>
</div>

<h2>B — 放大镜+手柄</h2>
<div class="row">
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><path d="M7 10h6M10 7v6"/></svg></div><div class="label">+</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1" stroke-dasharray="2 1.5"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></div><div class="label">1:1</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><path d="M7 10h6"/></svg></div><div class="label">−</div></div>
</div>

<h2>C — 极简圆点</h2>
<div class="row">
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg></div><div class="label">+</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="1.5" fill="#2C2626"/><circle cx="8" cy="12" r="1.5" fill="#2C2626"/><circle cx="16" cy="12" r="1.5" fill="#2C2626"/><circle cx="12" cy="17" r="1.5" fill="#2C2626"/></svg></div><div class="label">100%</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg></div><div class="label">−</div></div>
</div>

<h2>D — 箭头缩放</h2>
<div class="row">
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><polyline points="7 17 7 7 17 7"/></svg></div><div class="label">+</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="14" r="1" fill="#2C2626"/></svg></div><div class="label">1:1</div></div>
  <div style="text-align:center"><div class="btn"><svg viewBox="0 0 24 24"><polyline points="7 7 7 17 17 17"/></svg></div><div class="label">−</div></div>
</div>

</body></html>
