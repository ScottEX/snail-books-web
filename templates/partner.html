<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="蓝姐螺蛳粉">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#8B1E22">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<title>蓝姐螺蛳粉 · 合伙人资产</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/i18n.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  body { font-family:'Inter','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased; }
  .animate-scaleUp { animation:scaleUp .2s ease; }
  @keyframes scaleUp { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
  details summary::-webkit-details-marker { display:none; }
  details summary { list-style:none; cursor:pointer; }
  .lang-btn { color: #9CA3AF; font-size: 10px; padding: 2px 7px; border-radius: 5px; cursor: pointer; transition: all .2s; font-weight: 500; }
  .lang-btn:hover { color: #4B5563; background: #F3F4F6; }
  .lang-btn.active { color: #8B1E22; background: #FEE2E2; font-weight: 700; }
</style>
</head>
<body class="bg-[#FAFAFA] text-[#2D2D2D] min-h-screen">

<div class="max-w-5xl mx-auto px-4 py-4 md:py-5 space-y-4 pb-16">

  <!-- Header -->
  <header class="border-b border-gray-100 pb-3.5 flex justify-between items-start">
    <div>
      <a href="/" class="inline-flex items-center gap-1 text-[11px] text-gray-400 hover:text-[#8B1E22] transition-colors mb-2">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span data-i18n="backHome">返回首页</span>
      </a>
      <div class="flex items-center space-x-3">
        <div class="w-2 h-9 bg-[#8B1E22] rounded-full flex-shrink-0"></div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight text-[#1A1A1A] leading-tight" data-i18n="partnerTitle">蓝姐螺蛳粉合伙人资产</h1>
          <p class="text-[10px] text-gray-400 font-medium tracking-wide uppercase mt-0.5">Lan's Luosifen · Partner Capital</p>
        </div>
      </div>
    </div>
    <!-- Lang switcher -->
    <div class="flex gap-1 pt-1">
      <span class="lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">简</span>
      <span class="lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">繁</span>
      <span class="lang-btn" data-lang="en" onclick="setLang('en')">EN</span>
    </div>
  </header>

  <!-- 3 Stat Cards — Compact Horizontal -->
  <section class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <!-- Card: 初始基金 -->
    <div class="bg-white rounded-xl border border-gray-100 p-3.5 flex items-center gap-3.5 shadow-sm">
      <div class="w-9 h-9 rounded-lg bg-[#8B1E22]/8 flex items-center justify-center flex-shrink-0">
        <svg class="w-[18px] h-[18px] text-[#8B1E22]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z"/>
        </svg>
      </div>
      <div class="min-w-0">
        <div class="text-[10px] text-gray-400 font-medium tracking-wide" data-i18n="totalCapital">合伙初始基金总额</div>
        <div class="text-[15px] font-bold text-gray-900 mt-0.5 tracking-tight">¥130,000</div>
        <div class="text-[9px] text-emerald-600 font-medium mt-0.5"><span data-i18n="paidInRate">实缴率</span> 100%</div>
      </div>
    </div>

    <!-- Card: 分红池 -->
    <div class="bg-white rounded-xl border border-gray-100 p-3.5 flex items-center gap-3.5 shadow-sm justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center flex-shrink-0">
          <svg class="w-[18px] h-[18px] text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="text-[10px] text-gray-400 font-medium tracking-wide" data-i18n="distributedPool">已派发分红池</div>
          <div class="text-[15px] font-bold text-amber-600 mt-0.5 tracking-tight" id="stat-dividends">¥0</div>
          <div class="text-[9px] text-gray-400 font-medium mt-0.5" data-i18n="cumulativeByShare">累计派发 · 按比例分配</div>
        </div>
      </div>
      <button onclick="openDividendModal()" class="bg-[#8B1E22] hover:bg-[#73181B] text-white text-[10px] px-3 py-2 rounded-lg font-medium transition-all shadow-sm flex-shrink-0" data-i18n="issueDividend">发起分红</button>
    </div>

    <!-- Card: 合伙席位 -->
    <div onclick="showOrgChart()" class="bg-white rounded-xl border border-gray-100 p-3.5 flex items-center gap-3.5 shadow-sm cursor-pointer hover:shadow-md transition-all">
      <div class="w-9 h-9 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-[18px] h-[18px] text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
      </div>
      <div class="min-w-0">
        <div class="text-[10px] text-gray-400 font-medium tracking-wide" data-i18n="partnerSeats">合伙席位</div>
        <div class="text-[15px] font-bold text-gray-800 mt-0.5 tracking-tight">3 <span data-i18n="shareholders">位股东</span></div>
        <div class="text-[9px] text-gray-400 font-medium mt-0.5" data-i18n="lpStructure">有限合伙控股结构</div>
      </div>
    </div>
  </section>

  <!-- Partner Cards -->
  <div id="partner-error" class="hidden bg-[#FEF2F2] text-[#991B1B] text-[11px] rounded-xl px-4 py-3 mb-3 font-medium"></div>
  <section class="grid grid-cols-1 md:grid-cols-3 gap-3" id="partner-cards"></section>

  <!-- Capital Ledger -->
  <section class="bg-white rounded-2xl border border-gray-100 shadow-sm">
    <div class="p-5 border-b border-gray-50 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold tracking-wider text-gray-400 uppercase" data-i18n="capitalLedger">合伙人资本账目流水表</h2>
        <span class="text-[10px] text-gray-400" data-i18n="byRoundAndInvest">按分红轮次与出资分组</span>
      </div>
      <div class="flex gap-2">
        <button onclick="filterLedger('all')" id="filter-all" class="px-3 py-1.5 rounded-full text-[10px] font-bold bg-gray-800 text-white transition-all" data-i18n="all">全部</button>
        <button onclick="filterLedger('invest')" id="filter-invest" class="px-3 py-1.5 rounded-full text-[10px] font-medium bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all" data-i18n="invest">出资</button>
        <button onclick="filterLedger('mid')" id="filter-mid" class="px-3 py-1.5 rounded-full text-[10px] font-medium bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all" data-i18n="additional">追加</button>
        <button onclick="filterLedger('dividend')" id="filter-dividend" class="px-3 py-1.5 rounded-full text-[10px] font-medium bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all" data-i18n="dividend">分红</button>
      </div>
    </div>

    <!-- Desktop Table -->
    <div class="hidden md:block px-4 pb-4" id="ledger-desktop"></div>

    <!-- Mobile Cards -->
    <div class="block md:hidden divide-y divide-gray-50" id="ledger-mobile"></div>
  </section>

</div>

<!-- Dividend Modal -->
<div id="dividend-modal" class="fixed inset-0 bg-[#1A1A1A]/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="if(event.target===this)closeDividendModal()">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl animate-scaleUp overflow-hidden" onclick="event.stopPropagation()">
    <div class="bg-[#8B1E22] px-5 py-3.5 flex justify-between items-center">
      <div>
        <h3 class="text-sm font-bold text-white" data-i18n="issueProportional">发起比例分红</h3>
        <p class="text-[10px] text-red-200 mt-0.5" data-i18n="autoByShare">按股权穿透比例自动分配</p>
      </div>
      <button onclick="closeDividendModal()" class="text-red-200 hover:text-white text-lg leading-none">✕</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-[10px] font-bold text-gray-400 mb-1" data-i18n="totalToPool">拟向红利池注入的总金额 (元)</label>
        <input type="number" id="dividend-amount" data-i18n-placeholder="enterAmount" placeholder="输入金额" class="w-full bg-gray-50 border border-transparent rounded-xl p-3 text-xs font-bold focus:bg-white focus:border-[#8B1E22] focus:outline-none transition-all" oninput="calcDividendPreview()">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-gray-400 mb-1" data-i18n="roundNote">轮次备注</label>
        <input type="text" id="dividend-note" data-i18n-placeholder="roundNoteExample" placeholder="如：第6次分红" class="w-full bg-gray-50 border border-transparent rounded-xl p-3 text-xs focus:bg-white focus:border-[#8B1E22] focus:outline-none transition-all">
      </div>
      <div class="bg-gray-50 rounded-xl p-3 space-y-2">
        <div class="text-[9px] font-bold text-gray-400 uppercase tracking-wider" data-i18n="shareCalcResult">穿透股权计算结果：</div>

        <button onclick="executeDividend()" class="flex-1 bg-[#8B1E22] hover:bg-[#73181B] text-white rounded-xl py-2.5 text-xs font-medium transition-all shadow-sm" data-i18n="confirmIssue">确认发放并记账</button>
      </div>
    </div>
  </div>
</div>

      <div class="grid grid-cols-2 gap-3">

          <div class="text-[10px] text-gray-400 font-medium" data-i18n="totalInvest">总出资</div>

        </div>
        <div class="bg-amber-50 rounded-xl p-3">
          <div class="text-[10px] text-amber-500 font-medium" data-i18n="totalDividends">累计分红</div>
          <div class="text-sm font-bold text-amber-600 mt-0.5" id="pdetail-dividends"></div>
        </div>
        <div class="bg-gray-50 rounded-xl p-3">

<!-- Org Chart Modal -->
<div id="orgchart-modal" class="fixed inset-0 bg-[#1A1A1A]/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="closeOrgChart()">
  <div class="bg-white w-full max-w-xs rounded-2xl shadow-xl animate-scaleUp overflow-hidden" onclick="event.stopPropagation()">
    <div class="bg-[#8B1E22] px-5 py-3.5 flex justify-between items-center">
      <div>
        <h3 class="text-sm font-bold text-white" data-i18n="partnerStructure">合伙架构</h3>
        <p class="text-[10px] text-red-200 mt-0.5" data-i18n="lpControl">蓝姐螺蛳粉 · 有限合伙控股</p>
      </div>
      <button onclick="closeOrgChart()" class="text-red-200 hover:text-white text-lg leading-none">✕</button>

<script>
// Helper: fetch with 401 detection
async function authFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['X-Lang'] = curLang;
  var r = await fetch(url, opts);
  if (r.status === 401) {
    localStorage.setItem('redirect_after_login', window.location.pathname);
    window.location.href = '/login';
    return Promise.reject(new Error('redirect'));
  }
  return r;
}

let partnersData = [];
let dividendRounds = [];

function getPartnerRole(name) {
  var roles = {
    '张安武': t('chairman'),
    '江宽': t('ceo'),
    '蓝柳富': t('janitor')
  };
  return roles[name] || t('partner');
}

function showPartnerError(msg){
  var el = document.getElementById('partner-error');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}

async function loadPartners(){
  try {
  partnersData = await authFetch('/api/partners').then(r=>r.json());
  const totalDiv = partnersData.reduce((s,p)=>s+p.total_dividends,0);
  document.getElementById('stat-dividends').textContent = '¥'+totalDiv.toLocaleString();

  document.getElementById('partner-cards').innerHTML = partnersData.map((p,i)=>{
    const pct = p.investment>0 ? (p.total_dividends/p.investment*100).toFixed(0) : 0;
    const rem = p.investment - p.total_dividends;
    const isBack = p.total_dividends >= p.investment;
    const initInvest = p.name==='张安武'?44200:42900;
    const midInvest = p.investment - initInvest;
    const role = getPartnerRole(p.name);
    return `
    <div onclick="showPartnerDetail(${i})" class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 p-4 space-y-2.5 cursor-pointer">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-1.5">
          <h3 class="text-[13px] font-bold text-gray-800">${p.name}</h3>
          <span class="text-[10px] text-gray-400">${(p.share*100).toFixed(0)}%</span>
        </div>
        <span class="text-[9px] font-medium text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">${t('investComplete')}</span>
      </div>
      <div class="grid grid-cols-3 gap-1 text-[10px]">
        <div class="text-center"><span class="text-gray-400 block">${t('subscribedTotal')}</span><span class="font-semibold text-gray-900 tabular-nums">¥${p.investment.toLocaleString()}</span></div>
        <div class="text-center"><span class="text-gray-400 block">${t('initial')}</span><span class="font-semibold text-gray-700 tabular-nums">¥${initInvest.toLocaleString()}</span></div>
        <div class="text-center"><span class="text-gray-400 block">${t('additional')}</span><span class="font-semibold text-gray-700 tabular-nums">¥${midInvest.toLocaleString()}</span></div>
      </div>
      <div class="flex justify-between text-[11px] pt-1.5 border-t border-gray-50">
        <span class="text-amber-700 font-medium">${t('totalDividendsPaid')}</span>
        <span class="font-bold text-amber-600 tabular-nums">¥${p.total_dividends.toLocaleString()}</span>
      </div>
      <div class="flex justify-between text-[10px]">
        <span class="text-gray-400">${t('paybackRate')} ${pct}%</span>
        <span>${isBack ? '<span class="text-emerald-500 font-medium">'+t('fullyPaidBack')+'</span>' : '<span class="text-amber-500 font-medium">'+t('pendingPayback')+' ¥'+rem.toLocaleString()+'</span>'}</span>
      </div>
    </div>`;
  }).join('');

  await loadHistory();

  document.getElementById('filter-all').className = 'px-3 py-1.5 rounded-full text-[10px] font-bold bg-gray-800 text-white transition-all';
  } catch(e) {
    if (e.message !== 'redirect') {
      showPartnerError(t('errNet'));
    }
  }
}

function showPartnerDetail(index){
  const p = partnersData[index];
  const role = getPartnerRole(p.name);
  const pct = p.investment>0 ? (p.total_dividends/p.investment*100).toFixed(0) : 0;
  const rem = p.investment - p.total_dividends;
  const isBack = p.total_dividends >= p.investment;
  const initInvest = p.name==='张安武'?44200:42900;
  const midInvest = p.investment - initInvest;

  document.getElementById('pdetail-name').textContent = p.name;
  document.getElementById('pdetail-role').textContent = role;
  document.getElementById('pdetail-share').textContent = (p.share*100).toFixed(0)+'%';
  document.getElementById('pdetail-total').textContent = '¥'+p.investment.toLocaleString();
  document.getElementById('pdetail-dividends').textContent = '¥'+p.total_dividends.toLocaleString();
  document.getElementById('pdetail-init').textContent = '¥'+initInvest.toLocaleString();
  document.getElementById('pdetail-mid').textContent = '¥'+midInvest.toLocaleString();
  document.getElementById('pdetail-pct').textContent = t('paybackRate')+' '+pct+'%';
  document.getElementById('pdetail-bar').style.width = Math.min(pct,100)+'%';
  document.getElementById('pdetail-bar').className = 'h-full rounded-full transition-all duration-500 '+(isBack?'bg-emerald-500':'bg-amber-500');
  document.getElementById('pdetail-rem').innerHTML = isBack
    ? '<span class="text-emerald-500 font-medium">'+t('fullyPaidBackDetail')+'</span>'
    : '<span class="text-amber-500 font-medium">'+t('pendingPayback')+' ¥'+rem.toLocaleString()+'</span>';

  // Build dividend history
  const history = [];
  dividendRounds.forEach(round => {
    round.forEach(d => {
      if(d.partner === p.name && d.amount > 0){
        history.push({note: d.note || t('dividend'), amount: d.amount});
      }
    });
  });
  document.getElementById('pdetail-history').innerHTML = history.length
    ? history.map(h=>`
      <div class="flex justify-between items-center py-1.5 px-2.5 rounded-lg bg-amber-50/40 text-[11px]">
        <span class="text-gray-600">${h.note}</span>
        <span class="font-bold text-amber-600">¥${h.amount.toLocaleString()}</span>
      </div>`).join('')
    : '<div class="text-[10px] text-gray-400 text-center py-3">'+t('noDividendRecords')+'</div>';

  document.getElementById('partner-detail-modal').classList.remove('hidden');
  document.getElementById('partner-detail-modal').classList.add('flex');
}

let allGroups = [];

async function loadHistory(){
  const res = await authFetch('/api/dividends').then(r=>r.json());
  // Group flat dividend list by note
  const byNote = {};
  res.forEach(d => {
    const key = d.note || '__no_note__';
    if (!byNote[key]) byNote[key] = [];
    byNote[key].push(d);
  });
  dividendRounds = Object.values(byNote);

  allGroups = [];

  allGroups.push({
    title: t('initialApr2024'), type: 'invest',
    items: [{name:t('nameZhang'),amount:44200,sub:'34%'},{name:t('nameLan'),amount:42900,sub:'33%'},{name:t('nameJiang'),amount:42900,sub:'33%'}],
    total: 130000
  });
  allGroups.push({
    title: t('additionalJan2025'), type: 'mid',
    items: [{name:t('nameZhang'),amount:10255.08,sub:'34%'},{name:t('nameLan'),amount:9953.46,sub:'33%'},{name:t('nameJiang'),amount:9953.46,sub:'33%'}],
    total: 30162
  });

  dividendRounds.forEach(items => {
    const sorted = [...items].sort((a,b)=>b.amount-a.amount);
    const total = items.reduce((s,d)=>s+d.amount,0);
    allGroups.push({
      title: items[0].note || t('dividend'), type: 'dividend',
      items: sorted.map(d=>({name:d.partner,amount:d.amount,sub:''})),
      total, note: items[0].note
    });
  });

  filterLedger('all');
}

function filterLedger(filter){
  document.querySelectorAll('#filter-all,#filter-invest,#filter-mid,#filter-dividend').forEach(b=>{
    b.className = 'px-3 py-1.5 rounded-full text-[10px] font-medium bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all';
  });
  document.getElementById('filter-'+filter).className = 'px-3 py-1.5 rounded-full text-[10px] font-bold bg-gray-800 text-white transition-all';

  const groups = filter==='all' ? allGroups : allGroups.filter(g=>g.type===filter);
  renderLedger(groups);
}

function renderLedger(groups){
  // Desktop
  document.getElementById('ledger-desktop').innerHTML = groups.map(g=>{
    var typeLabel = g.type==='invest' ? t('invest') : (g.type==='mid' ? t('additional') : t('dividend'));
    var colors = {
      invest:  {dot:'bg-blue-500', headerBg:'bg-blue-50/60', typeText:'text-blue-600', label:typeLabel, amt:'text-gray-900'},
      mid:     {dot:'bg-purple-500', headerBg:'bg-purple-50/60', typeText:'text-purple-600', label:typeLabel, amt:'text-gray-900'},
      dividend:{dot:'bg-amber-500', headerBg:'bg-amber-50/60', typeText:'text-amber-600', label:typeLabel, amt:'text-amber-600'}
    };
    var c = colors[g.type];
    return `
    <div class="rounded-xl border border-gray-100 overflow-hidden mb-3 shadow-sm">
      <table class="w-full">
        <thead>
          <tr class="${c.headerBg} border-b border-gray-100/80">
            <th class="text-left px-4 py-2.5 text-[12px] font-semibold text-gray-800">${g.title}</th>
            <th class="text-center px-0 py-2.5 w-[2.5rem] text-[11px] ${c.typeText} font-semibold">${c.label}</th>
            <th class="text-right px-4 py-2.5 w-[6.5rem] text-xs font-bold ${c.amt} tabular-nums tracking-tight">
              ¥${g.total.toLocaleString()}
              ${g.type==='dividend'?`<button onclick="deleteRound(this)" data-note="${g.note.replace(/"/g,'&quot;')}" class="text-[10px] text-red-400 hover:text-red-500 font-medium transition-colors ml-2 font-normal">${t('deleteRecord')}</button>`:''}
            </th>
          </tr>
        </thead>
        <tbody>
          ${g.items.map(d=>`
          <tr class="border-t border-gray-50/80 hover:bg-gray-50/40 transition-colors">
            <td class="px-4 py-2.5 text-xs font-medium text-gray-700">${d.name}</td>
            <td class="text-center px-0 py-2.5 text-[11px] text-gray-400">${d.sub}</td>
            <td class="text-right px-4 py-2.5 text-xs font-bold ${c.amt} tabular-nums tracking-tight">¥${d.amount.toLocaleString()}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('');

  // Mobile
  document.getElementById('ledger-mobile').innerHTML = groups.map(g=>{
    var typeLabel = g.type==='invest' ? t('invest') : (g.type==='mid' ? t('additional') : t('dividend'));
    var colors = {
      invest:  {dot:'bg-blue-500', dotBg:'bg-blue-50', typeText:'text-blue-600', label:typeLabel, amt:'text-gray-900'},
      mid:     {dot:'bg-purple-500', dotBg:'bg-purple-50', typeText:'text-purple-600', label:typeLabel, amt:'text-gray-900'},
      dividend:{dot:'bg-amber-500', dotBg:'bg-amber-50', typeText:'text-amber-600', label:typeLabel, amt:'text-amber-600'}
    };
    var c = colors[g.type];
    return `
    <div class="px-4 py-3.5">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full ${c.dot}"></span>
          <span class="text-[12px] font-semibold text-gray-800">${g.title}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[11px] ${c.typeText} font-semibold">¥${g.total.toLocaleString()}</span>
          ${g.type==='dividend'?`<button onclick="deleteRound(this)" data-note="${g.note.replace(/"/g,'&quot;')}" class="text-[10px] text-red-400 hover:text-red-500 font-medium">${t('deleteRecord')}</button>`:''}
        </div>
      </div>
      <div class="space-y-1.5">
        ${g.items.map(d=>`
        <div class="flex justify-between items-center py-1.5 px-2.5 rounded-lg ${c.dotBg}/40">
          <span class="text-xs text-gray-600">${d.name} ${d.sub?`<span class="text-gray-400">· ${d.sub}</span>`:''}</span>
          <span class="text-xs font-bold ${c.amt} tabular-nums text-right">¥${d.amount.toLocaleString()}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

async function deleteRound(btn){
  const note = btn.dataset.note;
  document.getElementById('delete-note').value = note;
  document.getElementById('delete-round-name').textContent = note;
  document.getElementById('delete-confirm-modal').classList.remove('hidden');
  document.getElementById('delete-confirm-modal').classList.add('flex');
}

function confirmDeleteRound(){
  const note = document.getElementById('delete-note').value;
  document.getElementById('delete-confirm-modal').classList.add('hidden');
  document.getElementById('delete-confirm-modal').classList.remove('flex');
  authFetch('/api/dividends/delete',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({note})
  }).then(()=>loadPartners());
}

function cancelDeleteRound(){
  document.getElementById('delete-confirm-modal').classList.add('hidden');
  document.getElementById('delete-confirm-modal').classList.remove('flex');
}

function openDividendModal(){
  document.getElementById('dividend-modal').classList.remove('hidden');
  document.getElementById('dividend-modal').classList.add('flex');
  document.getElementById('dividend-amount').value = '';
  document.getElementById('dividend-note').value = '';
  calcDividendPreview();
}

function closeDividendModal(){
  document.getElementById('dividend-modal').classList.add('hidden');
  document.getElementById('dividend-modal').classList.remove('flex');
}

function calcDividendPreview(){
  const amount = parseFloat(document.getElementById('dividend-amount').value)||0;
  document.getElementById('dividend-preview').innerHTML = partnersData.map(p=>
    `<div class="flex justify-between text-xs text-gray-600"><span>${p.name} (${(p.share*100).toFixed(0)}%)</span><span class="font-medium text-gray-900">¥ ${(amount * p.share).toFixed(2)}</span></div>`
  ).join('');
}

async function executeDividend(){
  const amount = parseFloat(document.getElementById('dividend-amount').value);
  const note = document.getElementById('dividend-note').value.trim() || t('dividend');
  if(!amount||amount<=0) return;
  
  for(const p of partnersData){
    const share = parseFloat((amount * p.share).toFixed(2));
    await authFetch('/api/dividends',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({partner:p.name, amount:share, note})
    });
  }
  closeDividendModal();
  loadPartners();
}
